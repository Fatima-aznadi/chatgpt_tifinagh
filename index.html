<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ⵣ ⵜⵉⴼⵉⵏⴰⵖ</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Tifinagh&family=Inter:wght@400;500;600;700&display=swap');

    :root {
        --accent-1: #7c6cf5;
        --accent-2: #b18cf0;
        --panneau: rgba(255,255,255,0.05);
        --panneau-clair: rgba(255,255,255,0.09);
        --ligne: rgba(255,255,255,0.10);
        --ecru: #f0eefc;
        --ecru-doux: #a29fc4;
    }

    * { box-sizing: border-box; }
    body {
        margin: 0;
        color: var(--ecru);
        font-family: 'Inter', sans-serif;
        display: flex;
        height: 100vh;
        overflow: hidden;
        background:
            radial-gradient(circle at 15% 20%, rgba(124,108,245,0.35), transparent 45%),
            radial-gradient(circle at 85% 10%, rgba(177,140,240,0.25), transparent 40%),
            radial-gradient(circle at 50% 90%, rgba(90,70,180,0.25), transparent 50%),
            #0b0a17;
    }

    /* ---------- Sidebar ---------- */
    #sidebar {
        width: 270px;
        flex-shrink: 0;
        background: rgba(255,255,255,0.02);
        border-right: 1px solid var(--ligne);
        display: flex;
        flex-direction: column;
        padding: 1.25rem 0.9rem;
    }
    .marque {
        display: flex;
        align-items: baseline;
        gap: 0.5rem;
        font-size: 1.15rem;
        font-weight: 700;
        padding: 0.25rem 0.25rem 1rem;
    }
    .marque .glyphe {
        font-family: 'Noto Sans Tifinagh', sans-serif;
        background: linear-gradient(135deg, var(--accent-2), var(--accent-1));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        font-size: 1.5rem;
    }

    #bouton-nouvelle {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
        color: white;
        border: none;
        border-radius: 10px;
        padding: 0.7rem 0.75rem;
        font-family: 'Inter', sans-serif;
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
        margin-bottom: 1.25rem;
    }
    #bouton-nouvelle:hover { filter: brightness(1.08); }

    .label-section {
        font-size: 0.72rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--ecru-doux);
        padding: 0.4rem 0.35rem 0.5rem;
        margin-bottom: 0.2rem;
    }
    #liste-conversations {
        flex: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 0.1rem;
    }
    .item-conversation {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-radius: 8px;
        padding: 0.55rem 0.6rem;
        font-size: 0.85rem;
        cursor: pointer;
        color: var(--ecru-doux);
        gap: 0.4rem;
    }
    .item-conversation:hover { background: var(--panneau); color: var(--ecru); }
    .item-conversation.active {
        background: var(--panneau-clair);
        color: var(--ecru);
    }
    .item-conversation .titre {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex: 1;
    }
    .item-conversation .supprimer {
        opacity: 0;
        color: var(--ecru-doux);
        font-size: 0.85rem;
    }
    .item-conversation:hover .supprimer { opacity: 1; }
    .item-conversation .supprimer:hover { color: #ff8080; }
    #vide-historique { color: var(--ecru-doux); font-size: 0.8rem; padding: 0.6rem 0.35rem; opacity: 0.7; }

    /* ---------- Zone principale ---------- */
    #principal { flex: 1; display: flex; flex-direction: column; min-width: 0; }

    #entete { padding: 0.9rem 1.5rem 0; }
    #entete-contenu {
        max-width: 760px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        gap: 0.6rem;
        color: var(--ecru-doux);
        font-size: 0.85rem;
    }

    #zone-chat { flex: 1; overflow-y: auto; padding: 1.5rem 1.5rem 1rem; }
    #conteneur-messages {
        max-width: 760px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 1.1rem;
    }

    #accueil { max-width: 640px; margin: 3rem auto 0; text-align: center; }
    #accueil .orbe {
        width: 64px; height: 64px;
        margin: 0 auto 1.1rem;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #d6c8ff, var(--accent-2) 40%, var(--accent-1) 75%, #3a2e7a);
        box-shadow: 0 0 40px rgba(124,108,245,0.5);
        display: flex; align-items: center; justify-content: center;
        font-family: 'Noto Sans Tifinagh', sans-serif;
        font-size: 1.7rem;
        color: rgba(255,255,255,0.92);
    }
    #accueil h1 { font-size: 1.9rem; font-weight: 700; margin: 0 0 0.4rem; }
    #accueil p { color: var(--ecru-doux); margin-bottom: 1.8rem; font-size: 0.95rem; }
    #exemples { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.7rem; }
    .bouton-exemple {
        background: var(--panneau);
        border: 1px solid var(--ligne);
        border-radius: 12px;
        padding: 0.9rem 1rem;
        font-size: 1.05rem;
        color: var(--ecru-doux);
        cursor: pointer;
        transition: border-color 0.15s ease, background 0.15s ease;
        text-align: left;
        font-family: 'Noto Sans Tifinagh', sans-serif;
    }
    .bouton-exemple:hover { border-color: var(--accent-2); background: rgba(124,108,245,0.1); color: var(--ecru); }

    .ligne-message { display: flex; }
    .ligne-message.user { justify-content: flex-end; }
    .ligne-message.assistant { justify-content: flex-start; }
    .bulle-question {
        background: rgba(124,108,245,0.18);
        border: 1px solid rgba(124,108,245,0.3);
        border-radius: 14px 14px 2px 14px;
        padding: 0.75rem 1.1rem;
        max-width: 78%;
        font-size: 0.95rem;
        font-family: 'Inter', sans-serif;
    }
    .bloc-assistant { max-width: 88%; }
    .bulle-tifinagh {
        font-family: 'Noto Sans Tifinagh', sans-serif;
        font-size: 1.35rem;
        line-height: 1.95;
        background: var(--panneau);
        border: 1px solid var(--ligne);
        border-radius: 2px 14px 14px 14px;
        padding: 1.1rem 1.35rem;
    }
    .sources {
        font-size: 0.72rem;
        color: var(--accent-2);
        margin-top: 0.45rem;
    }

    #zone-saisie { padding: 1rem 1.5rem 1.4rem; }
    #formulaire {
        max-width: 760px;
        margin: 0 auto;
        display: flex;
        gap: 0.5rem;
        background: var(--panneau);
        border: 1px solid var(--ligne);
        border-radius: 16px;
        padding: 0.4rem 0.5rem 0.4rem 1rem;
    }
    #champ-question {
        flex: 1;
        background: none;
        border: none;
        outline: none;
        color: var(--ecru);
        font-family: 'Inter', sans-serif;
        font-size: 0.95rem;
    }
    #champ-question::placeholder { color: var(--ecru-doux); }
    #bouton-envoyer {
        background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
        border: none;
        border-radius: 10px;
        padding: 0.6rem 1.3rem;
        color: white;
        font-weight: 600;
        font-family: 'Inter', sans-serif;
        cursor: pointer;
    }
    #bouton-envoyer:hover { filter: brightness(1.08); }
    #bouton-envoyer:disabled { opacity: 0.5; cursor: not-allowed; }

    #bouton-clavier {
        background: var(--panneau-clair);
        border: 1px solid var(--ligne);
        border-radius: 10px;
        padding: 0.6rem 0.8rem;
        color: var(--ecru);
        font-family: 'Noto Sans Tifinagh', sans-serif;
        font-size: 1.15rem;
        cursor: pointer;
        flex-shrink: 0;
    }

    #bouton-clavier:hover {
        border-color: var(--accent-2);
        background: rgba(124,108,245,0.15);
    }

    #clavier-tifinagh {
        max-width: 760px;
        margin: 0.5rem auto 0;
        display: none;
        background: var(--panneau);
        border: 1px solid var(--ligne);
        border-radius: 14px;
        padding: 0.7rem;
    }

    #clavier-tifinagh.visible { display: block; }

    .touches-tifinagh {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.35rem;
    }

    .touches-tifinagh button {
        min-width: 38px;
        height: 38px;
        border: 1px solid var(--ligne);
        border-radius: 8px;
        background: var(--panneau-clair);
        color: var(--ecru);
        font-family: 'Noto Sans Tifinagh', sans-serif;
        font-size: 1.2rem;
        cursor: pointer;
    }

    .touches-tifinagh button:hover {
        background: rgba(124,108,245,0.2);
        border-color: var(--accent-2);
    }

    #touche-espace {
        font-family: 'Inter', sans-serif;
        padding: 0 0.8rem;
        min-width: 75px;
        font-size: 0.8rem;
    }

    #touche-supprimer {
        font-family: 'Inter', sans-serif;
        min-width: 50px;
    }

    #touche-effacer {
        font-family: 'Inter', sans-serif;
        min-width: 65px;
        font-size: 0.75rem;
    }

    #bouton-menu {
        display: none;
        align-items: center;
        justify-content: center;
        width: 2rem; height: 2rem;
        background: var(--panneau);
        border: 1px solid var(--ligne);
        border-radius: 8px;
        color: var(--ecru);
        cursor: pointer;
        font-size: 1rem;
        flex-shrink: 0;
    }

    @media (max-width: 640px) {
        #sidebar {
            position: fixed;
            left: 0; top: 0; bottom: 0;
            z-index: 20;
            transform: translateX(-100%);
            transition: transform 0.2s ease;
            box-shadow: 4px 0 16px rgba(0,0,0,0.4);
            background: #14122a;
        }
        #sidebar.ouverte { transform: translateX(0); }
        #exemples { grid-template-columns: 1fr; }
        #bouton-menu { display: inline-flex; }
        #voile {
            display: none;
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 15;
        }
        #voile.visible { display: block; }
    }

</style>
</head>
<body>

<div id="voile"></div>
<div id="sidebar">
    <div class="marque"><span class="glyphe">ⵣ</span> ⵜⵉⴼⵉⵏⴰⵖ</div>
    <button id="bouton-nouvelle">ⵜⵉⵎⵙⵙⵉⵔⵜ ⵜⴰⵎⴰⵢⵏⵓⵜ</button>
    <div class="label-section">ⴰⵎⵣⵔⵓⵢ</div>
    <div id="liste-conversations"></div>
</div>

<div id="principal">
    <div id="entete">
        <div id="entete-contenu">
            <button id="bouton-menu">☰</button>
            <span>ⴰⵎⵙⵙⵡⵉ ⵙ ⵜⴼⵉⵏⴰⵖ ⵙ ⵓⵙⵙⵏ ⵏ ⵓⴽⵛⵛⵓⵎ ⴰⴷⵉⵙⴰⵏ</span>
        </div>
    </div>

    <div id="zone-chat">
        <div id="accueil">
            <div class="orbe">ⵣ</div>
            <h1>ⴰⵏⵙⵓⴼ ⵙ ⵜⵉⴼⵉⵏⴰⵖ</h1>
            <p>ⵙⵙⵇⵙⴰ ⵜⴰⵡⵜⵔⵜ ⵏⴽ، ⵜⵉⵔⵔⴰ ⵜⴷⴷⵓ ⵙ ⵜⵉⴼⵉⵏⴰⵖ</p>
            <div id="exemples">
                <button class="bouton-exemple" data-question="ⵎⴰⵜⵜⴰ ⵜⴳⴰ ⵜⵉⴼⵉⵏⴰⵖ?">ⵎⴰⵜⵜⴰ ⵜⴳⴰ ⵜⵉⴼⵉⵏⴰⵖ?</button>
                <button class="bouton-exemple" data-question="ⵎⴰⵏⵉ ⵜⴻⴽⴽⴰ ⵜⵉⴼⵉⵏⴰⵖ?">ⵎⴰⵏⵉ ⵜⴻⴽⴽⴰ ⵜⵉⴼⵉⵏⴰⵖ?</button>
                <button class="bouton-exemple" data-question="ⵎⴰⵏ ⵜⴰⵎⵙⴽⵉⵔⵜ ⵏ ⵜⵉⴼⵉⵏⴰⵖ؟">ⵎⴰⵏ ⵜⴰⵎⵙⴽⵉⵔⵜ ⵏ ⵜⵉⴼⵉⵏⴰⵖ؟</button>
            </div>
        </div>
        <div id="conteneur-messages"></div>
    </div>

    <div id="zone-saisie">
        <form id="formulaire">
            <input id="champ-question" type="text" placeholder="ⴰⵔⴰ ⵜⴰⵡⵜⵔⵜ ⵏⴽ ⴷⴰ..." autocomplete="off" required>
            <button type="button" id="bouton-clavier" title="ⴰⵙⵏⵏⴰ ⵏ ⵜⵉⴼⵉⵏⴰⵖ">ⵣ</button>
            <button type="submit" id="bouton-envoyer">ⴰⵣⵏ</button>
        </form>
        <div id="clavier-tifinagh">
            <div class="touches-tifinagh">
                <button type="button">ⴰ</button><button type="button">ⴱ</button><button type="button">ⴳ</button>
                <button type="button">ⴷ</button><button type="button">ⴹ</button><button type="button">ⴻ</button>
                <button type="button">ⴼ</button><button type="button">ⴽ</button><button type="button">ⵀ</button>
                <button type="button">ⵃ</button><button type="button">ⵄ</button><button type="button">ⵅ</button>
                <button type="button">ⵇ</button><button type="button">ⵉ</button><button type="button">ⵊ</button>
                <button type="button">ⵍ</button><button type="button">ⵎ</button><button type="button">ⵏ</button>
                <button type="button">ⵖ</button><button type="button">ⵔ</button><button type="button">ⵕ</button>
                <button type="button">ⵙ</button><button type="button">ⵚ</button><button type="button">ⵛ</button>
                <button type="button">ⵜ</button><button type="button">ⵟ</button><button type="button">ⵡ</button>
                <button type="button">ⵢ</button><button type="button">ⵣ</button><button type="button">ⵥ</button><button type="button">?</button><button type="button">!</button><button type="button">.</button><button type="button">،</button><button type="button">:</button><button type="button">-</button>
                <button type="button" id="touche-espace">ⵉⵎⵉⵔ</button>
                <button type="button" id="touche-supprimer">⌫</button><button type="button" id="touche-effacer">ⵙⵙⵓⴼⴼⵖ</button>
            </div>
        </div>
    </div>
</div>

<script>
    const API_URL = "http://localhost:8000";
    const CLE_STOCKAGE = "tifinagh_gpt_conversations";

    let conversations = chargerConversations();
    let idActif = null;

    function chargerConversations() {
        try {
            return JSON.parse(localStorage.getItem(CLE_STOCKAGE)) || {};
        } catch {
            return {};
        }
    }

    function sauvegarderConversations() {
        localStorage.setItem(CLE_STOCKAGE, JSON.stringify(conversations));
    }

    function nouvelleConversation() {
        const id = "conv_" + Date.now();
        conversations[id] = { titre: null, messages: [] };
        idActif = id;
        sauvegarderConversations();
        rendreSidebar();
        rendreChat();
        fermerSidebarMobile();
    }

    function supprimerConversation(id, evenement) {
        evenement.stopPropagation();
        delete conversations[id];
        if (idActif === id) idActif = null;
        sauvegarderConversations();
        rendreSidebar();
        rendreChat();
    }

    function selectionnerConversation(id) {
        idActif = id;
        rendreSidebar();
        rendreChat();
        fermerSidebarMobile();
    }

    function fermerSidebarMobile() {
        document.getElementById("sidebar").classList.remove("ouverte");
        document.getElementById("voile").classList.remove("visible");
    }

    function conversationActive() {
        if (idActif === null || !conversations[idActif]) {
            nouvelleConversation();
        }
        return conversations[idActif];
    }

    function rendreSidebar() {
        const liste = document.getElementById("liste-conversations");
        const ids = Object.keys(conversations)
            .filter(id => conversations[id].messages.length > 0)
            .reverse();

        if (ids.length === 0) {
            liste.innerHTML = '<div id="vide-historique">Aucune conversation pour l\'instant.</div>';
            return;
        }

        liste.innerHTML = "";
        for (const id of ids) {
            const conv = conversations[id];
            const div = document.createElement("div");
            div.className = "item-conversation" + (id === idActif ? " active" : "");
            div.innerHTML = `
                <span class="titre">${conv.titre}</span>
                <span class="supprimer">✕</span>
            `;
            div.addEventListener("click", () => selectionnerConversation(id));
            div.querySelector(".supprimer").addEventListener("click", (e) => supprimerConversation(id, e));
            liste.appendChild(div);
        }
    }

    function rendreChat() {
        const conv = idActif ? conversations[idActif] : null;
        const accueil = document.getElementById("accueil");
        const conteneur = document.getElementById("conteneur-messages");

        if (!conv || conv.messages.length === 0) {
            accueil.style.display = "block";
            conteneur.innerHTML = "";
            return;
        }

        accueil.style.display = "none";
        conteneur.innerHTML = "";
        for (const msg of conv.messages) {
            const ligne = document.createElement("div");
            ligne.className = "ligne-message " + msg.role;
            if (msg.role === "user") {
                ligne.innerHTML = `<div class="bulle-question">${msg.contenu}</div>`;
            } else {
                let sourcesHTML = "";
                if (msg.sources && msg.sources.length > 0) {
                    sourcesHTML = `<div class="sources">${msg.sources.join(", ")}</div>`;
                }
                ligne.innerHTML = `
                    <div class="bloc-assistant">
                        <div class="bulle-tifinagh">${msg.contenu}</div>
                        ${sourcesHTML}
                    </div>
                `;
            }
            conteneur.appendChild(ligne);
        }
        document.getElementById("zone-chat").scrollTop = document.getElementById("zone-chat").scrollHeight;
    }

    async function envoyerQuestion(question) {
        const conv = conversationActive();
        if (conv.titre === null) {
            conv.titre = question.length > 34 ? question.slice(0, 34) + "…" : question;
        }
        conv.messages.push({ role: "user", contenu: question });
        sauvegarderConversations();
        rendreSidebar();
        rendreChat();

        document.getElementById("bouton-envoyer").disabled = true;

        try {
            const reponse = await fetch(`${API_URL}/question`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ question, k: 3 }),
            });
            if (!reponse.ok) throw new Error(`Erreur API : ${reponse.status}`);
            const donnees = await reponse.json();

            conv.messages.push({ role: "assistant", contenu: donnees.reponse, sources: donnees.sources || [] });
        } catch (erreur) {
            conv.messages.push({ role: "assistant", contenu: "⚠ " + erreur.message, sources: [] });
        } finally {
            sauvegarderConversations();
            rendreChat();
            document.getElementById("bouton-envoyer").disabled = false;
        }
    }

    document.getElementById("bouton-nouvelle").addEventListener("click", nouvelleConversation);

    const sidebar = document.getElementById("sidebar");
    const voile = document.getElementById("voile");
    document.getElementById("bouton-menu").addEventListener("click", () => {
        sidebar.classList.toggle("ouverte");
        voile.classList.toggle("visible");
    });
    voile.addEventListener("click", () => {
        sidebar.classList.remove("ouverte");
        voile.classList.remove("visible");
    });

    // Clavier Tifinagh intégré
    const boutonClavier = document.getElementById("bouton-clavier");
    const clavierTifinagh = document.getElementById("clavier-tifinagh");
    const champQuestion = document.getElementById("champ-question");

    boutonClavier.addEventListener("click", () => {
        clavierTifinagh.classList.toggle("visible");
        champQuestion.focus();
    });

    document.querySelectorAll(".touches-tifinagh button").forEach(touche => {
        touche.addEventListener("click", () => {
            if (touche.id === "touche-supprimer") {
                champQuestion.value = champQuestion.value.slice(0, -1);
            } else if (touche.id === "touche-effacer") {
                champQuestion.value = "";
            } else if (touche.id === "touche-espace") {
                champQuestion.value += " ";
            } else {
                champQuestion.value += touche.textContent;
            }
            champQuestion.focus();
        });
    });

    document.getElementById("formulaire").addEventListener("submit", (e) => {
        e.preventDefault();
        const champ = document.getElementById("champ-question");
        const question = champ.value.trim();
        if (!question) return;
        champ.value = "";
        envoyerQuestion(question);
    });

    document.querySelectorAll(".bouton-exemple").forEach(bouton => {
        bouton.addEventListener("click", () => envoyerQuestion(bouton.dataset.question));
    });

    rendreSidebar();
    rendreChat();
</script>
</body>
</html>
